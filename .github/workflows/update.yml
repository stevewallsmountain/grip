name: Update Grip forecast

on:
  schedule:
    - cron: "5 * * * *"   # every hour at 5 past (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nerd
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build forecast page
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          export GRIP_PAGE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          python grip.py

      - name: Save state and calibration cache (also keeps the schedule alive)
        run: |
          if [ -n "$(git status --porcelain state.json calibration.json calibration.csv)" ]; then
            git config user.name "nerd-bot"
            git config user.email "nerd-bot@users.noreply.github.com"
            git add state.json calibration.json calibration.csv
            git commit -m "Update state"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
